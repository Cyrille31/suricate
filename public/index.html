<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suricate</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #EEF2F4; color: #1B2733; display: grid; place-items: center; min-height: 100vh; }
    .box { background: #fff; border: 1px solid #DCE4E8; border-radius: 16px; padding: 36px 40px; max-width: 460px; text-align: center; }
    .crest { width: 96px; height: 96px; border-radius: 22px; object-fit: cover; }
    h1 { color: #0E7C7B; margin: 14px 0 4px; }
    p { color: #5B6B7A; }
    a.btn { display: block; margin-top: 14px; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: 700; }
    .a1 { background: #0E7C7B; color: #fff; }
    .a2 { background: #e3f1f0; color: #0A5E5D; }
    .tag { font-size: .8rem; color: #5B6B7A; margin-top: 18px; }
    .moe { display: flex; align-items: center; justify-content: center; gap: 10px;
           margin-top: 22px; padding-top: 18px; border-top: 1px solid #DCE4E8; color: #5B6B7A; font-size: .82rem; }
    .moe img { height: 40px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="box">
    <img class="crest" src="assets/logo_suricate.gif" alt="Logo Suricate" />
    <h1>Suricate</h1>
    <p>Suivi de la douleur post-opératoire à domicile</p>
    <a class="btn a1" href="/patient/">Application patient</a>
    <a class="btn a2" href="/doctor/">Tableau de bord médecin</a>
    <p class="tag">MVP-0 · v0.8.0 — prototype de démonstration</p>
    <div class="moe">
      <span>Maître d'œuvre</span>
      <img src="assets/logo_cgexcel.jpg" alt="CGExcel" />
    </div>
  </div>
</body>
</html>
